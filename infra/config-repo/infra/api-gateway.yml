app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER
      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600
      locator:
        enabled: false
      routes:
        - id: product-service-read
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: product-service-write
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**
            - Method=POST,PATCH,PUT,DELETE
        - id: inventory-service-read
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: inventory-service-write
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
            - Method=POST,PUT,PATCH,DELETE
        - id: order-service-read
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: order-service-write
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
            - Method=POST,PUT,PATCH,DELETE
